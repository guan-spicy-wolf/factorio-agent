[project]
name = "fgen"
version = "0.1.0"
description = "Factorio blueprint generator library (phase 0: serverless foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fgen = "fgen.cli:main"

[project.optional-dependencies]
solver = [
    "ortools>=9.15.6755",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "headless: needs the Factorio headless binary ($FACTORIO_DIR); skipped when it is missing",
]
